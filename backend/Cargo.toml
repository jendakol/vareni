[package]
name = "cooking-app"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["multipart", "macros"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "uuid", "time", "json", "bigdecimal", "tls-native-tls"] }
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
openidconnect = { version = "4", default-features = false, features = ["reqwest", "native-tls"] }
sha2 = "0.10"
subtle = "2"
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }
tower = "0.5"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-stream = "0.1"
futures = "0.3"
base64 = "0.22"
scraper = "0.22"
pgvector = { version = "0.4", features = ["sqlx"] }
rand = "0.9"
bytes = "1"
tokio-util = { version = "0.7", features = ["io"] }
dotenvy = "0.15"
ort = { version = "2.0.0-rc.12", features = ["download-binaries", "ndarray"] }
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
ndarray = "0.17"
urlencoding = "2"
url = "2"
chromiumoxide = { version = "0.9", default-features = false }
axum-prometheus = "0.8"
metrics = "0.24"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

[features]
# X-Debug-User header auth and /api/auth/dev-login; additionally requires ENVIRONMENT=local at runtime.
debug-auth = []

[dev-dependencies]
jsonwebtoken = "9"
wiremock = "0.6"
testcontainers = "0.24"
testcontainers-modules = { version = "0.12", features = ["postgres"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
mime = "0.3"
